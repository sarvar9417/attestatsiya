<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 760 490" width="760" height="490"><title id="title">Manfiy son kiritilguncha yig‘indi hisoblash</title><desc id="desc">Attestatsiya savoli uchun algoritm yoki yo‘naltirilgan grafning aniq qayta tiklangan ko‘rinishi. Matnlar va strelkalar mantiqiy bajarilish tartibini belgilaydi.</desc><rect width="760" height="490" fill="#ffffff" rx="16"/><defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<style>.node{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.decision{fill:#fef9c3;stroke:#a16207;stroke-width:2}.txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.edge{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow)}.label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#334155}</style></defs><rect class="node" x="100" y="20" width="152" height="43" rx="10"/><text class="txt" x="176" y="41.5">Boshlash</text><rect class="node" x="102" y="86" width="148" height="54" rx="10"/><text class="txt" x="176" y="113">S := 0</text><rect class="node" x="104" y="162" width="144" height="52" rx="10"/><text class="txt" x="176" y="188">a ni kiritish</text><polygon class="decision" points="176,237 259,298 176,359 93,298"/><text class="txt" x="176" y="298">a &lt; 0 ?</text><rect class="node" x="342" y="271" width="173" height="53" rx="10"/><text class="txt" x="428.5" y="297.5">S ni chiqarish</text><rect class="node" x="561" y="273" width="146" height="50" rx="10"/><text class="txt" x="634" y="298">Tugatish</text><rect class="node" x="100" y="392" width="157" height="53" rx="10"/><text class="txt" x="178.5" y="418.5">S := S + a</text><path class="edge" d="M176 63 V86"/><path class="edge" d="M176 140 V162"/><path class="edge" d="M176 214 V237"/><path class="edge" d="M259 298 H342"/><path class="edge" d="M515 298 H561"/><path class="edge" d="M176 359 V392"/><path class="edge" d="M100 419 H44 V185 H104"/><text class="label" x="268" y="280">Ha</text><text class="label" x="190" y="383">Yo‘q</text></svg>