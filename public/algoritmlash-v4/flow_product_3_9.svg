<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 760 490" width="760" height="490"><title id="title">P := P × i, i := i + 3 sikli</title><desc id="desc">Attestatsiya savoli uchun algoritm yoki yo‘naltirilgan grafning aniq qayta tiklangan ko‘rinishi. Matnlar va strelkalar mantiqiy bajarilish tartibini belgilaydi.</desc><rect width="760" height="490" fill="#ffffff" rx="16"/><defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<style>.node{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.decision{fill:#fef9c3;stroke:#a16207;stroke-width:2}.txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.edge{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrow)}.label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#334155}</style></defs><rect class="node" x="94" y="28" width="152" height="46" rx="10"/><text class="txt" x="170" y="51">Boshlash</text><rect class="node" x="90" y="96" width="160" height="54" rx="10"/><text class="txt" x="170" y="123">P := 1; i := 3</text><polygon class="decision" points="170,172 255,232 170,292 85,232"/><text class="txt" x="170" y="232">i ≤ 9 ?</text><rect class="node" x="332" y="205" width="182" height="52" rx="10"/><text class="txt" x="423" y="231">P := P × i</text><rect class="node" x="332" y="314" width="182" height="52" rx="10"/><text class="txt" x="423" y="340">i := i + 3</text><rect class="node" x="88" y="370" width="165" height="53" rx="10"/><text class="txt" x="170.5" y="396.5">P ni chiqarish</text><rect class="node" x="87" y="449" width="166" height="33" rx="10"/><text class="txt" x="170" y="465.5">Tugatish</text><path class="edge" d="M170 74 V96"/><path class="edge" d="M170 150 V172"/><path class="edge" d="M255 232 H332"/><path class="edge" d="M423 257 V314"/><path class="edge" d="M332 340 H49 V232 H85"/><path class="edge" d="M170 292 V370"/><path class="edge" d="M170 423 V449"/><text class="label" x="263" y="218">Ha</text><text class="label" x="183" y="326">Yo‘q</text></svg>