name: TASK-431 Excel PDF source QA
on:
  pull_request:
    paths:
      - 'scripts/task431-excel-math-functions.test.mjs'
      - '.github/workflows/task431-excel-math.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-formula-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/task431-excel-math-functions.test.mjs
