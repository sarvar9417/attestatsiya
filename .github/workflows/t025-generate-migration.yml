name: T025 Generate Versioned Migration

on:
  push:
    branches:
      - task/T-025-versioned-parametric-migration
    paths:
      - .github/workflows/t025-generate-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/T-025-versioned-parametric-migration
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Verify CLI command surface
        run: |
          supabase --version
          supabase --help
          supabase migration --help
          supabase migration new --help

      - name: Create migration with Supabase CLI
        id: migration
        run: |
          supabase migration new parametric_generated_questions
          MIGRATION="$(find supabase/migrations -maxdepth 1 -type f -name '*_parametric_generated_questions.sql' | sort | tail -n 1)"
          test -n "$MIGRATION"
          echo "path=$MIGRATION" >> "$GITHUB_OUTPUT"
          echo "Created $MIGRATION"

      - name: Materialize deterministic generated SQL into migration
        run: |
          npm run content:generated:sql
          MIGRATION="${{ steps.migration.outputs.path }}"
          {
            echo "-- T-025: versioned content migration generated by Supabase CLI."
            echo "-- Source: scripts/gen_parametric_seed_sql.ts"
            cat supabase/generated/parametric_questions.sql
          } > "$MIGRATION"

      - name: Verify generated migration on fresh PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          docker run -d --rm --name t025-postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=attestatsiya_test -p 5432:5432 postgres:17
          trap 'docker stop t025-postgres >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d attestatsiya_test; then break; fi
            sleep 1
          done

          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f supabase/tests/bootstrap_local.sql

          BROKEN_MIGRATION='supabase/migrations/20260730000011_sync_source_reference.sql'
          REPAIR_MIGRATION='supabase/migrations/20260731000013_fix_question_keys_rls.sql'
          SOURCE_LINK_MIGRATION='supabase/migrations/20260731000014_source_lesson_links.sql'
          CONTENT_MIGRATION='supabase/migrations/20260731000012_m01_content_seed.sql'
          REPAIR_APPLIED=false
          SOURCE_LINK_APPLIED=false

          while IFS= read -r migration; do
            if [ "$migration" = "$BROKEN_MIGRATION" ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "$REPAIR_MIGRATION"
              REPAIR_APPLIED=true
              continue
            fi

            if [ "$migration" = "$CONTENT_MIGRATION" ] && [ "$SOURCE_LINK_APPLIED" = false ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "$SOURCE_LINK_MIGRATION"
              SOURCE_LINK_APPLIED=true
            fi

            if [ "$migration" = "$REPAIR_MIGRATION" ] && [ "$REPAIR_APPLIED" = true ]; then
              continue
            fi

            if [ "$migration" = "$SOURCE_LINK_MIGRATION" ] && [ "$SOURCE_LINK_APPLIED" = true ]; then
              continue
            fi

            psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f supabase/tests/parametric_generated_pool.test.sql

      - name: Commit CLI-created migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "T-025: add versioned parametric content migration"
          git push origin HEAD:task/T-025-versioned-parametric-migration
