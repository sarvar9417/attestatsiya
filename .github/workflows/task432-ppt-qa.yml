name: TASK-432 PowerPoint source QA
on:
  pull_request:
    paths:
      - 'scripts/task432-powerpoint-six.test.mjs'
      - 'supabase/maintenance/task432_publish_six_powerpoint_concepts.sql'
      - '.github/workflows/task432-ppt-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-ppt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/task432-powerpoint-six.test.mjs
