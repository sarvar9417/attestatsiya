name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI faqat UI smoke-test qiladi; haqiqiy Supabase credential ishlatilmaydi.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: attestatsiya_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attestatsiya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fresh database — complete active migration chain
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/bootstrap_local.sql

          # 20260730000011 remote'da rollback bo'lgan tarixiy migration;
          # 20260731000013 uning to'liq idempotent forward-fix'i va migration
          # history'da 00011 repair-applied deb belgilangan. Fresh install ham
          # buzilgan 00011'ni emas, 00013 forward-fix'ni qo'llashi kerak.
          SKIP_MIGRATION='supabase/migrations/20260730000011_sync_source_reference.sql'

          # Production'da faol bo'lgan barcha boshqa migratsiyalar filename
          # tartibida qo'llanadi. Yangi migration qo'shilsa CI uni avtomatik
          # ravishda tekshiradi — workflow ro'yxatini qo'lda yangilash shart emas.
          while IFS= read -r migration; do
            if [ "${migration}" = "${SKIP_MIGRATION}" ]; then
              echo "Skipping repaired historical migration ${migration}"
              continue
            fi
            echo "Applying ${migration}"
            psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          # Seed idempotent bo'lishi shart; migratsiyalardan keyin qayta
          # ishlatilishi schema/content driftini ham ushlaydi.
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/seed.sql \
            -f supabase/tests/security_hardening.test.sql

      - name: Remote drift reconciliation
        run: |
          createdb attestatsiya_upgrade_test
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_upgrade_test \
            -f supabase/tests/bootstrap_local.sql \
            -f supabase/migrations/20260730000000_uuid_baseline.sql \
            -f supabase/tests/remote_drift_fixture.sql \
            -f supabase/migrations/20260730000008_taxonomy_contract.sql \
            -f supabase/migrations/20260730000009_official_2026_seed.sql \
            -f supabase/migrations/20260730000010_rpc_security_hardening.sql \
            -f supabase/tests/remote_drift_assertions.sql
