      - name: Production-like lesson drift reconciliation
        run: |
          createdb attestatsiya_lesson_drift_test
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test \
            -f supabase/tests/bootstrap_local.sql

          BROKEN_MIGRATION='supabase/migrations/20260730000011_sync_source_reference.sql'
          REPAIR_MIGRATION='supabase/migrations/20260731000013_fix_question_keys_rls.sql'
          SOURCE_LINK_MIGRATION='supabase/migrations/20260731000014_source_lesson_links.sql'
          CONTENT_MIGRATION='supabase/migrations/20260731000012_m01_content_seed.sql'
          SOURCE_START='supabase/migrations/20261009073000_m02_source_backed_lessons.sql'
          ORDER_PREP='supabase/migrations/20261012122600_prepare_legacy_lesson_orders.sql'
          REPAIR_APPLIED=false
          SOURCE_LINK_APPLIED=false
          DRIFT_FIXTURE_APPLIED=false
          ORDER_PREP_APPLIED=false

          while IFS= read -r migration; do
            # Owner-authorized 2026-10-21 Office Y3 and AI-editorial
            # releases require production-only staged records and owner
            # profiles. They are applied and fingerprint-verified in production.
            # Skip ONLY these data/owner-waiver releases in fresh CI; preserve
            # the strict default guard and all other schema/security migrations.
            case "${migration}" in
              supabase/migrations/20261021220000_task381_y3_missing_goal_immutable_fix_and_office_qa_queue.sql|\
              supabase/migrations/20261021221001_task382_office_38_explicit_y3_goals_immutable_revisions.sql|\
              supabase/migrations/20261021222000_task383_office_final_six_y3_semantic_repair.sql|\
              supabase/migrations/20261021223000_task385_office_nine_more_generic_y3_revisions.sql|\
              supabase/migrations/20261021230000_task388_owner_ai_legacy_y2_20_review_release.sql|\
              supabase/migrations/20261021231000_task389_owner_ai_12_y2_y3_instruction_clarity_revisions.sql|\
              supabase/migrations/20261021232000_task390_resolve_verified_live_pedguli_image_warning.sql|\
              supabase/migrations/20261021233000_task391_pedagogy_two_y1_context_disambiguations_ai_delegated.sql|\
              supabase/migrations/20261021234000_task392_owner_delegated_ai_y2_narrow_official_mock_eligibility.sql|\
              supabase/migrations/20261021235000_task393_eight_verified_ks_y1_distractors_owner_ai_release.sql|\
              supabase/migrations/20261021235500_task394_ai_review_last_pedagogy_distractor_batch_atomic.sql|\
              supabase/migrations/20261022000000_task396_two_pedagogy_ambiguous_published_second_revisions.sql|\
              supabase/migrations/20261022001000_task397_five_informatika_y1_length_bias_semantic_repair.sql|\
              supabase/migrations/20261022002000_task398_ten_y1_informatika_office_security_answer_length_repairs.sql|\
              supabase/migrations/20261022003000_task399_ten_y1_info_office_security_second_answer_length_repairs.sql|\
              supabase/migrations/20261022004000_task400_ten_y1_hardware_network_length_bias_repairs.sql|\
              supabase/migrations/20261022005000_task401_ten_y1_information_hardware_concept_length_repairs.sql|\
              supabase/migrations/20261022051049_task402_ten_y1_info_office_security_answer_quality_repairs.sql|\
              supabase/migrations/20261022051517_task403_ten_y1_info_office_security_semantic_balance_repairs.sql|\
              supabase/migrations/20261022080203_task404_ten_y1_info_office_security_distractor_balance.sql|\
              supabase/migrations/20261022031000_task428_pedguli_verified_batch02.sql|\
              supabase/migrations/20261022032000_task428_pedguli_verified_batch03.sql|\
              supabase/migrations/20261022033000_task428_pedguli_verified_batch04.sql|\
              supabase/migrations/20261022034000_task428_pedguli_verified_batch05.sql)
                echo "Skipping previously applied production-specific data release in clean-schema CI: ${migration}"
                continue
                ;;
            esac

            if [ "${migration}" = "${BROKEN_MIGRATION}" ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test -f "${REPAIR_MIGRATION}"
              REPAIR_APPLIED=true
              continue
            fi

            if [ "${migration}" = "${CONTENT_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = false ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test -f "${SOURCE_LINK_MIGRATION}"
              SOURCE_LINK_APPLIED=true
            fi

            if [ "${migration}" = "${REPAIR_MIGRATION}" ] && [ "${REPAIR_APPLIED}" = true ]; then
              continue
            fi

            if [ "${migration}" = "${SOURCE_LINK_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = true ]; then
              continue
            fi

            # Reproduce the real production ordering problem before the first
            # missing source-backed lesson migration: legacy published lessons
            # occupy canonical order_idx slots. Free those slots first.
            if [ "${migration}" = "${SOURCE_START}" ] && [ "${DRIFT_FIXTURE_APPLIED}" = false ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test \
                -f supabase/tests/production_lesson_drift_fixture.sql \
                -f "${ORDER_PREP}"
              DRIFT_FIXTURE_APPLIED=true
              ORDER_PREP_APPLIED=true
            fi

            if [ "${migration}" = "${ORDER_PREP}" ] && [ "${ORDER_PREP_APPLIED}" = true ]; then
              continue
            fi

            psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test \
            -f supabase/tests/canonical_lesson_drift_reconcile.test.sql \
            -f supabase/tests/spec_zero_construct_review_bank.test.sql \
            -f supabase/tests/anon_rpc_hardening.test.sql

  # Required branch protection context. The legacy "quality" commit status
  # written by frontend-quality can be insufficient if branch protection
  # expects an Actions check-run named "quality" from the GitHub Actions app.
  # Keep the actual check-run AND legacy commit status in sync; neither bypasses
  # frontend tests, backend checks or the database gate.
  quality:
    name: quality
    needs: [frontend-quality, backend, database]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce all required CI jobs
        env:
          FRONTEND_RESULT: ${{ needs['frontend-quality'].result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          echo "frontend-quality: ${FRONTEND_RESULT}"
          echo "backend: ${BACKEND_RESULT}"
          echo "database: ${DATABASE_RESULT}"
          test "${FRONTEND_RESULT}" = "success"
          test "${BACKEND_RESULT}" = "success"
          test "${DATABASE_RESULT}" = "success"
