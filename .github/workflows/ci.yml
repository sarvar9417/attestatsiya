name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI faqat UI smoke-test qiladi; haqiqiy Supabase credential ishlatilmaydi.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Private bank validator syntax
        run: node --check scripts/validate-private-question-bank.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Pedmahorat Guli offline curation safeguards
        run: node --test scripts/tests/curate-pedguli-export.test.mjs scripts/tests/curate-pedguli-html.test.mjs scripts/tests/import-pedguli-candidates.test.mjs scripts/tests/import-pedguli-stage4.test.mjs

      - name: Parametric generated pool invariants
        run: npm run content:generated:check

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_KEY: ci-placeholder-key
      AUTH_REDIRECT_URL: http://localhost:3001

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (api entry)
        run: npm run typecheck:api

      - name: Unit tests
        run: npm run test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: attestatsiya_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attestatsiya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node for generated content
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install generator dependencies
        run: npm ci

      - name: Fresh database — complete active migration chain
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/bootstrap_local.sql

          BROKEN_MIGRATION='supabase/migrations/20260730000011_sync_source_reference.sql'
          REPAIR_MIGRATION='supabase/migrations/20260731000013_fix_question_keys_rls.sql'
          SOURCE_LINK_MIGRATION='supabase/migrations/20260731000014_source_lesson_links.sql'
          CONTENT_MIGRATION='supabase/migrations/20260731000012_m01_content_seed.sql'
          REPAIR_APPLIED=false
          SOURCE_LINK_APPLIED=false

          # 00011 remote'da rollback bo'lgan va migration history'da repair-applied
          # deb belgilangan. 00013 uning idempotent replacement'i. Fresh install
          # production repair semantikasini takrorlash uchun 00011 nuqtasida
          # 00013 ni qo'llaydi va normal joyida qayta ishlatmaydi.
          #
          # 00012 tarixiy content seed source_lesson_id ustuniga murojaat qiladi,
          # ustun esa keyingi 00014 da ADD COLUMN IF NOT EXISTS bilan yaratiladi.
          # Fresh DB uchun 00014 schema prerequisite'ni 00012 dan oldin bir marta
          # qo'llaymiz; 00014 normal joyiga kelganda uni qayta ishlatmaymiz.
          while IFS= read -r migration; do
            if [ "${migration}" = "${BROKEN_MIGRATION}" ]; then
              echo "Replacing repaired historical migration ${migration} with ${REPAIR_MIGRATION}"
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "${REPAIR_MIGRATION}"
              REPAIR_APPLIED=true
              continue
            fi

            if [ "${migration}" = "${CONTENT_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = false ]; then
              echo "Preloading schema prerequisite ${SOURCE_LINK_MIGRATION} before ${CONTENT_MIGRATION}"
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "${SOURCE_LINK_MIGRATION}"
              SOURCE_LINK_APPLIED=true
            fi

            if [ "${migration}" = "${REPAIR_MIGRATION}" ] && [ "${REPAIR_APPLIED}" = true ]; then
              echo "Skipping already-applied repair ${migration}"
              continue
            fi

            if [ "${migration}" = "${SOURCE_LINK_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = true ]; then
              echo "Skipping already-applied schema prerequisite ${migration}"
              continue
            fi

            echo "Applying ${migration}"
            psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          # Seed idempotent bo'lishi shart; migratsiyalardan keyin qayta
          # ishlatilishi schema/content driftini ham ushlaydi.
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/seed.sql \
            -f supabase/tests/security_hardening.test.sql \
            -f supabase/tests/custom_exam.test.sql \
            -f supabase/tests/custom_test_presets.test.sql \
            -f supabase/tests/rls_product_access.test.sql \
            -f supabase/tests/onboarding_profile.test.sql \
            -f supabase/tests/mastery_srs_foundation.test.sql \
            -f supabase/tests/adaptive_practice_selector.test.sql \
            -f supabase/tests/m01_professional_bank_import.test.sql \
            -f supabase/tests/section_mock_50.test.sql \
            -f supabase/tests/official_mock_50.test.sql \
            -f supabase/tests/mock_y2_option_projection.test.sql \
            -f supabase/tests/professional_practice_15.test.sql \
            -f supabase/tests/pedguli_original_topic_bank.test.sql \
            -f supabase/tests/pedguli_html_original_24.test.sql \
            -f supabase/tests/pedguli_m16_scenarios_v4.test.sql \
            -f supabase/tests/professional_120_canonical_links.test.sql \
            -f supabase/tests/pedguli_editorial_fingerprint_gate.test.sql \
            -f supabase/tests/task201_pedagogy_publish_gate.test.sql \
            -f supabase/tests/task202_pedagogy_revision_queue.test.sql \
            -f supabase/tests/task202_atomic_pedagogy_publish.test.sql \
            -f supabase/tests/task202_verified_pdf_review_authoring.test.sql \
            -f supabase/tests/task202_atomic_admin_y1_save.test.sql \
            -f supabase/tests/task202_semantic_source_key_corrections.test.sql \
            -f supabase/tests/task202_assistant_distractor_proposals.test.sql \
            -f supabase/tests/task202_proposals_stage_e2e.test.sql \
            -f supabase/tests/task203_pedagogy_owner_bank_parity.test.sql \
            -f supabase/tests/pedguli_private_candidate_inbox.test.sql \
            -f supabase/tests/pedguli_candidate_human_review.test.sql \
            -f supabase/tests/pedguli_topic_suggestion_queue.test.sql \
            -f supabase/tests/pedguli_stage4_private_triage.test.sql \
            -f supabase/tests/m02_source_backed_lessons.test.sql \
            -f supabase/tests/m03_office_source_backed_lessons.test.sql \
            -f supabase/tests/a3_logic_num_algo_lessons.test.sql \
            -f supabase/tests/a4_programming_lessons.test.sql \
            -f supabase/tests/m09_source_backed_lessons.test.sql \
            -f supabase/tests/m10_m11_graphics_web_lessons.test.sql \
            -f supabase/tests/m12_m13_network_security_lessons.test.sql \
            -f supabase/tests/m14_kasb_standarti_lessons.test.sql \
            -f supabase/tests/axb_chapter_practice.test.sql \
            -f supabase/tests/review_question_option_rls.test.sql \
            -f supabase/tests/m16_informatika_metodikasi_lessons.test.sql \
            -f supabase/tests/m15_umumiy_pedagogika_lessons.test.sql \
            -f supabase/tests/pedagogy_theory_corpus_expand.test.sql \
            -f supabase/tests/pedagogy_theory_corpus_complete.test.sql \
            -f supabase/tests/m15_topic_bank_complete.test.sql \
            -f supabase/tests/pedagogy_preflight_objective_drafts.test.sql \
            -f supabase/tests/pedagogy_private_quality_flags.test.sql \
            -f supabase/tests/pedagogy_pdf_private_candidate_inbox.test.sql \
            -f supabase/tests/pedagogy_pdf_candidate_triage.test.sql \
            -f supabase/tests/pedagogy_pdf_corpus_review_bank_v1.test.sql \
            -f supabase/tests/pedagogy_pdf_corpus_review_bank_v2.test.sql \
            -f supabase/tests/source_backed_lesson_coverage.test.sql \
            -f supabase/tests/task063_format_bank_reconcile.test.sql \
            -f supabase/tests/spec_zero_construct_review_bank.test.sql \
            -f supabase/tests/anon_rpc_hardening.test.sql \
            -f supabase/tests/m01_exact_source_lesson_reconcile.test.sql \
            -f supabase/tests/canonical_lesson_drift_reconcile.test.sql \
            -f supabase/tests/m02_release_readiness.test.sql \
            -f supabase/tests/m01_exact_source_lesson_reconcile.test.sql

      - name: Pedagogy PDF candidate triage rules
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/pedagogy_pdf_candidate_triage_fixture.sql \
            -f supabase/maintenance/20261013_pedagogy_pdf_candidate_triage.sql \
            -f supabase/maintenance/20261013_pedagogy_pdf_candidate_triage.sql \
            -f supabase/maintenance/20261013_pedagogy_pdf_near_duplicate_review.sql \
            -f supabase/tests/pedagogy_pdf_candidate_triage_rules.test.sql

      - name: Pedagogy PDF wave 2 verification
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/pedagogy_pdf_wave2_verify_fixture.sql \
            -f supabase/maintenance/20261013_pedagogy_pdf_wave2_verify.sql \
            -f supabase/maintenance/20261013_pedagogy_pdf_wave2_verify.sql \
            -f supabase/tests/pedagogy_pdf_wave2_verify.test.sql

      - name: Pedagogy PDF exhaustive editorial review
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/pedagogy_pdf_exhaustive_review_fixture.sql \
            -f supabase/maintenance/20261013_pedagogy_pdf_exhaustive_review.sql \
            -f supabase/maintenance/20261013_pedagogy_pdf_exhaustive_review.sql \
            -f supabase/tests/pedagogy_pdf_exhaustive_review.test.sql

      - name: General pedagogy attestation candidate bucket
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/general_pedagogy_attestation_bucket_fixture.sql \
            -f supabase/migrations/20261013170000_general_pedagogy_attestation_bucket.sql \
            -f supabase/migrations/20261013170000_general_pedagogy_attestation_bucket.sql \
            -f supabase/tests/general_pedagogy_attestation_bucket.test.sql

      - name: Generate and verify parametric DB pool
        run: |
          npm run content:generated:sql

          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/generated/parametric_questions.sql \
            -f supabase/generated/parametric_questions.sql \
            -f supabase/tests/parametric_generated_pool.test.sql
      
      - name: Source-lesson reconciliation (idempotent, no production writes)
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/source_less_demo_fixture.sql \
            -f supabase/maintenance/20261012_legacy_source_missing_quarantine.sql \
            -f supabase/maintenance/20261012_legacy_source_missing_quarantine.sql \
            -f supabase/maintenance/20261012_generated_source_lesson_safe_rebind.sql \
            -f supabase/maintenance/20261012_generated_source_lesson_safe_rebind.sql \
            -f supabase/tests/generated_lesson_reconcile.test.sql \
            -f supabase/tests/source_less_demo_quarantine.test.sql

      - name: Remote drift reconciliation
        run: |
          createdb attestatsiya_upgrade_test
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_upgrade_test \
            -f supabase/tests/bootstrap_local.sql \
            -f supabase/migrations/20260730000000_uuid_baseline.sql \
            -f supabase/tests/remote_drift_fixture.sql \
            -f supabase/migrations/20260730000008_taxonomy_contract.sql \
            -f supabase/migrations/20260730000009_official_2026_seed.sql \
            -f supabase/migrations/20260730000010_rpc_security_hardening.sql \
            -f supabase/tests/remote_drift_assertions.sql

      - name: Production-like lesson drift reconciliation
        run: |
          createdb attestatsiya_lesson_drift_test
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test \
            -f supabase/tests/bootstrap_local.sql

          BROKEN_MIGRATION='supabase/migrations/20260730000011_sync_source_reference.sql'
          REPAIR_MIGRATION='supabase/migrations/20260731000013_fix_question_keys_rls.sql'
          SOURCE_LINK_MIGRATION='supabase/migrations/20260731000014_source_lesson_links.sql'
          CONTENT_MIGRATION='supabase/migrations/20260731000012_m01_content_seed.sql'
          SOURCE_START='supabase/migrations/20261009073000_m02_source_backed_lessons.sql'
          ORDER_PREP='supabase/migrations/20261012122600_prepare_legacy_lesson_orders.sql'
          REPAIR_APPLIED=false
          SOURCE_LINK_APPLIED=false
          DRIFT_FIXTURE_APPLIED=false
          ORDER_PREP_APPLIED=false

          while IFS= read -r migration; do
            if [ "${migration}" = "${BROKEN_MIGRATION}" ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test -f "${REPAIR_MIGRATION}"
              REPAIR_APPLIED=true
              continue
            fi

            if [ "${migration}" = "${CONTENT_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = false ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test -f "${SOURCE_LINK_MIGRATION}"
              SOURCE_LINK_APPLIED=true
            fi

            if [ "${migration}" = "${REPAIR_MIGRATION}" ] && [ "${REPAIR_APPLIED}" = true ]; then
              continue
            fi

            if [ "${migration}" = "${SOURCE_LINK_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = true ]; then
              continue
            fi

            # Reproduce the real production ordering problem before the first
            # missing source-backed lesson migration: legacy published lessons
            # occupy canonical order_idx slots. Free those slots first.
            if [ "${migration}" = "${SOURCE_START}" ] && [ "${DRIFT_FIXTURE_APPLIED}" = false ]; then
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test \
                -f supabase/tests/production_lesson_drift_fixture.sql \
                -f "${ORDER_PREP}"
              DRIFT_FIXTURE_APPLIED=true
              ORDER_PREP_APPLIED=true
            fi

            if [ "${migration}" = "${ORDER_PREP}" ] && [ "${ORDER_PREP_APPLIED}" = true ]; then
              continue
            fi

            psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_lesson_drift_test \
            -f supabase/tests/canonical_lesson_drift_reconcile.test.sql \
            -f supabase/tests/spec_zero_construct_review_bank.test.sql \
            -f supabase/tests/anon_rpc_hardening.test.sql
