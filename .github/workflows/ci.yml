name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the Actions check-run name distinct from the legacy required
  # commit-status context `quality`. When both have the same name GitHub
  # may require both, and PR merge validation can remain 'expected'.
  frontend-quality:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI faqat UI smoke-test qiladi; haqiqiy Supabase credential ishlatilmaydi.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Private bank validator syntax
        run: node --check scripts/validate-private-question-bank.mjs

      - name: TASK-305 M13 evidence-based bank QA and keyless proposal guard
        run: node scripts/task305_m13_attestation_quality_audit.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Pedmahorat Guli offline curation safeguards
        run: node --test scripts/tests/curate-pedguli-export.test.mjs scripts/tests/curate-pedguli-html.test.mjs scripts/tests/import-pedguli-candidates.test.mjs scripts/tests/import-pedguli-stage4.test.mjs

      - name: TASK-270 original candidate metadata safeguards
        run: node --test scripts/tests/task270_candidate_metadata.test.mjs

      - name: Parametric generated pool invariants
        run: npm run content:generated:check

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      # Legacy GitHub branch-protection rules expect a 'quality' commit STATUS.
      # The successful job check-run alone is not recognized as this status.
      # Publish only after the full quality job (including E2E) has succeeded.
      - name: Publish successful quality commit status
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SHA: ${{ github.sha }}
        run: |
          for sha in "$CI_SHA" "$PR_HEAD_SHA"; do
            if [ -z "$sha" ]; then continue; fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -f state=success \
              -f context=quality \
              -f description="CI quality: lint, types, unit, build and E2E passed" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_KEY: ci-placeholder-key
      AUTH_REDIRECT_URL: http://localhost:3001

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (api entry)
        run: npm run typecheck:api

      - name: Unit tests
        run: npm run test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: attestatsiya_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attestatsiya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node for generated content
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install generator dependencies
        run: npm ci

      - name: Validate migration version uniqueness and timestamp format
        run: python3 scripts/check_migration_filenames.py

      - name: Fresh database — complete active migration chain
        run: |
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/tests/bootstrap_local.sql

          BROKEN_MIGRATION='supabase/migrations/20260730000011_sync_source_reference.sql'
          REPAIR_MIGRATION='supabase/migrations/20260731000013_fix_question_keys_rls.sql'
          SOURCE_LINK_MIGRATION='supabase/migrations/20260731000014_source_lesson_links.sql'
          CONTENT_MIGRATION='supabase/migrations/20260731000012_m01_content_seed.sql'
          REPAIR_APPLIED=false
          SOURCE_LINK_APPLIED=false

          # 00011 remote'da rollback bo'lgan va migration history'da repair-applied
          # deb belgilangan. 00013 uning idempotent replacement'i. Fresh install
          # production repair semantikasini takrorlash uchun 00011 nuqtasida
          # 00013 ni qo'llaydi va normal joyida qayta ishlatmaydi.
          #
          # 00012 tarixiy content seed source_lesson_id ustuniga murojaat qiladi,
          # ustun esa keyingi 00014 da ADD COLUMN IF NOT EXISTS bilan yaratiladi.
          # Fresh DB uchun 00014 schema prerequisite'ni 00012 dan oldin bir marta
          # qo'llaymiz; 00014 normal joyiga kelganda uni qayta ishlatmaymiz.
          while IFS= read -r migration; do
            # Owner-authorized 2026-10-21 Office Y3 and AI-editorial
            # releases require production-only staged records and owner
            # profiles. They are applied and fingerprint-verified in production.
            # Skip ONLY these data/owner-waiver releases in fresh CI; preserve
            # the strict default guard and all other schema/security migrations.
            case "${migration}" in
              supabase/migrations/20261021220000_task381_y3_missing_goal_immutable_fix_and_office_qa_queue.sql|\
              supabase/migrations/20261021221001_task382_office_38_explicit_y3_goals_immutable_revisions.sql|\
              supabase/migrations/20261021222000_task383_office_final_six_y3_semantic_repair.sql|\
              supabase/migrations/20261021223000_task385_office_nine_more_generic_y3_revisions.sql|\
              supabase/migrations/20261021230000_task388_owner_ai_legacy_y2_20_review_release.sql|\
              supabase/migrations/20261021231000_task389_owner_ai_12_y2_y3_instruction_clarity_revisions.sql|\
              supabase/migrations/20261021232000_task390_resolve_verified_live_pedguli_image_warning.sql|\
              supabase/migrations/20261021233000_task391_pedagogy_two_y1_context_disambiguations_ai_delegated.sql|\
              supabase/migrations/20261021234000_task392_owner_delegated_ai_y2_narrow_official_mock_eligibility.sql|\
              supabase/migrations/20261021235000_task393_eight_verified_ks_y1_distractors_owner_ai_release.sql|\
              supabase/migrations/20261021235500_task394_ai_review_last_pedagogy_distractor_batch_atomic.sql|\
              supabase/migrations/20261022000000_task396_two_pedagogy_ambiguous_published_second_revisions.sql|\
              supabase/migrations/20261022001000_task397_five_informatika_y1_length_bias_semantic_repair.sql|\
              supabase/migrations/20261022002000_task398_ten_y1_informatika_office_security_answer_length_repairs.sql|\
              supabase/migrations/20261022003000_task399_ten_y1_info_office_security_second_answer_length_repairs.sql|\
              supabase/migrations/20261022004000_task400_ten_y1_hardware_network_length_bias_repairs.sql|\
              supabase/migrations/20261022005000_task401_ten_y1_information_hardware_concept_length_repairs.sql|\
              supabase/migrations/20261022051049_task402_ten_y1_info_office_security_answer_quality_repairs.sql|\
              supabase/migrations/20261022051517_task403_ten_y1_info_office_security_semantic_balance_repairs.sql|\
              supabase/migrations/20261022080203_task404_ten_y1_info_office_security_distractor_balance.sql|\
              supabase/migrations/20261022031000_task428_pedguli_verified_batch02.sql|\
              supabase/migrations/20261022032000_task428_pedguli_verified_batch03.sql|\
              supabase/migrations/20261022033000_task428_pedguli_verified_batch04.sql|\
              supabase/migrations/20261022034000_task428_pedguli_verified_batch05.sql)
                echo "Skipping previously applied production-specific data release in clean-schema CI: ${migration}"
                continue
                ;;
            esac

            if [ "${migration}" = "${BROKEN_MIGRATION}" ]; then
              echo "Replacing repaired historical migration ${migration} with ${REPAIR_MIGRATION}"
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "${REPAIR_MIGRATION}"
              REPAIR_APPLIED=true
              continue
            fi

            if [ "${migration}" = "${CONTENT_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = false ]; then
              echo "Preloading schema prerequisite ${SOURCE_LINK_MIGRATION} before ${CONTENT_MIGRATION}"
              psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "${SOURCE_LINK_MIGRATION}"
              SOURCE_LINK_APPLIED=true
            fi

            if [ "${migration}" = "${REPAIR_MIGRATION}" ] && [ "${REPAIR_APPLIED}" = true ]; then
              echo "Skipping already-applied repair ${migration}"
              continue
            fi

            if [ "${migration}" = "${SOURCE_LINK_MIGRATION}" ] && [ "${SOURCE_LINK_APPLIED}" = true ]; then
              echo "Skipping already-applied schema prerequisite ${migration}"
              continue
            fi

            echo "Applying ${migration}"
            psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test -f "${migration}"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          # Seed idempotent bo'lishi shart; migratsiyalardan keyin qayta
          # ishlatilishi schema/content driftini ham ushlaydi.
          psql -X -v ON_ERROR_STOP=1 -d attestatsiya_test \
            -f supabase/seed.sql \
            -f supabase/tests/security_hardening.test.sql \
            -f supabase/tests/custom_exam.test.sql \
            -f supabase/tests/group_mock.test.sql \
            -f supabase/tests/group_mock_modes.test.sql \
            -f supabase/tests/group_mock_resilience.test.sql \
            -f supabase/tests/custom_exam_presets.test.sql \
            -f supabase/tests/rls_product_access.test.sql \
            -f supabase/tests/onboarding_profile.test.sql \
            -f supabase/tests/mastery_srs_foundation.test.sql \
            -f supabase/tests/adaptive_practice_selector.test.sql \
            -f supabase/tests/m01_professional_bank_import.test.sql \
            -f supabase/tests/section_mock_50.test.sql \
            -f supabase/tests/official_mock_50.test.sql \
            -f supabase/tests/active_mock_resume.test.sql \
            -f supabase/tests/all_assessment_active_resume.test.sql \
            -f supabase/tests/editable_answer_revision_all_kinds.test.sql \
            -f supabase/tests/task306_question_bank_remediation.test.sql \
            -f supabase/tests/task254_y2_side_integrity.test.sql \
            -f supabase/tests/mock_y2_option_projection.test.sql \
            -f supabase/tests/professional_practice_15.test.sql \
            -f supabase/tests/pedguli_original_topic_bank.test.sql \
            -f supabase/tests/pedguli_html_original_24.test.sql \
            -f supabase/tests/pedguli_m16_scenarios_v4.test.sql \
            -f supabase/tests/professional_120_canonical_links.test.sql \
            -f supabase/tests/pedguli_editorial_fingerprint_gate.test.sql \
            -f supabase/tests/task201_pedagogy_publish_gate.test.sql \
            -f supabase/tests/task429_pedagogy_semantic_publish_gate.test.sql \
            -f supabase/tests/task432_pedagogy_source_evidence_publish_gate.test.sql \
            -f supabase/tests/task433_all_test_pools_source_evidence.test.sql \
            -f supabase/tests/task202_pedagogy_revision_queue.test.sql \
            -f supabase/tests/task202_atomic_pedagogy_publish.test.sql \
            -f supabase/tests/task202_verified_pdf_review_authoring.test.sql \
            -f supabase/tests/task202_atomic_admin_y1_save.test.sql \
            -f supabase/tests/task202_semantic_source_key_corrections.test.sql \
            -f supabase/tests/task202_assistant_distractor_proposals.test.sql \
            -f supabase/tests/task202_proposals_stage_e2e.test.sql \
            -f supabase/tests/task203_pedagogy_owner_bank_parity.test.sql \
            -f supabase/tests/pedguli_private_candidate_inbox.test.sql \
            -f supabase/tests/pedguli_candidate_human_review.test.sql \
            -f supabase/tests/pedguli_topic_suggestion_queue.test.sql \
            -f supabase/tests/pedguli_stage4_private_triage.test.sql \
            -f supabase/tests/m02_source_backed_lessons.test.sql \
            -f supabase/tests/m03_office_source_backed_lessons.test.sql \
            -f supabase/tests/a3_logic_num_algo_lessons.test.sql \
            -f supabase/tests/a4_programming_lessons.test.sql \
            -f supabase/tests/m09_source_backed_lessons.test.sql \
            -f supabase/tests/m10_m11_graphics_web_lessons.test.sql \
            -f supabase/tests/task213_graphics_web_v2_review_contract.test.sql \
            -f supabase/tests/task214_graphics_web_380_practice_review_contract.test.sql \
            -f supabase/tests/task338_m10_owner_ai_eight_release.test.sql \
            -f supabase/tests/task346_missing_visual_media_contract.sql \
            -f supabase/tests/m12_m13_network_security_lessons.test.sql \
            -f supabase/tests/m14_kasb_standarti_lessons.test.sql \
            -f supabase/tests/axb_chapter_practice.test.sql \
            -f supabase/tests/review_question_option_rls.test.sql \
            -f supabase/tests/m16_informatika_metodikasi_lessons.test.sql \
            -f supabase/tests/m15_umumiy_pedagogika_lessons.test.sql \
