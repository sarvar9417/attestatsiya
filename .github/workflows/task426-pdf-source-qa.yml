name: TASK-426 PDF source editorial QA

on:
  pull_request:
    paths:
      - 'scripts/task426-pdf-logic.test.mjs'
      - 'docs/TASK426_INFORMATIKA_PDF_SOURCE_REMEDIATION_20261021.md'
      - '.github/workflows/task426-pdf-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pdf-source-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check seven source-repair predicates and unique editorial answers
        run: node --test scripts/task426-pdf-logic.test.mjs
