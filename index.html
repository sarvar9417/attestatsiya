    <!-- Dark mode flash prevention + Mobile keyboard handling -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'system' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.getElementById('theme-color').setAttribute('content', '#030712');
        }
        // Mobile keyboard: adjust viewport height when keyboard opens
        if (window.visualViewport) {
          function adjustViewport() {
            document.documentElement.style.setProperty('--vh', window.visualViewport.height * 0.01 + 'px');
          }
          window.visualViewport.addEventListener('resize', adjustViewport);
          adjustViewport();
        }
      })();
    </script>
